<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Đà Lạt Escape · Team 6</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f7;
      --surface: #fff;
      --ink: #1d1d1f;
      --muted: #64646c;
      --accent: #0066cc;
      --line: #e6e6eb;
      --selected: #edf5ff;
      --radius: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button, .choice { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .app { width: min(100%, 1120px); margin: auto; padding: 32px 16px 40px; }
    .trip { margin-bottom: 24px; }
    .eyebrow { margin: 0; color: var(--accent); font-size: 14px; font-weight: 700; }
    h1 { margin: 5px 0 6px; font-size: clamp(38px, 8vw, 68px); letter-spacing: -.058em; line-height: 1.04; }
    .sub { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      border-radius: 16px;
      background: #e8e8ed;
      padding: 4px;
      margin: 0 0 16px;
    }
    .tabs button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .tabs button span { display: block; font-size: 15px; color: var(--ink); }
    .tabs .active { background: var(--surface); box-shadow: 0 1px 4px #0002; }
    .tabs .active span { color: var(--accent); }
    .layout { display: grid; gap: 16px; align-items: start; min-width: 0; }
    .mapcard, .slot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
    .mapcard { padding: 14px; }
    .maphead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 12px; }
    .maphead h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .maphead span { color: var(--muted); font-size: 13px; white-space: nowrap; }
    #map { height: clamp(195px, 31vh, 280px); border-radius: 15px; background: #e8edf1; isolation: isolate; }
    .actions { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; margin-top: 12px; }
    .action {
      display: grid;
      place-items: center;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: 650;
    }
    .action.alt { background: var(--selected); color: var(--accent); }
    .timeline { display: grid; gap: 12px; }
    .slot { padding: 16px; }
    .time { color: var(--muted); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .slot h2 { margin: 4px 0 12px; font-size: 21px; letter-spacing: -.035em; line-height: 1.2; }
    .choice {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      min-height: 56px;
      margin-top: 5px;
      padding: 10px 8px 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .choice:has(input:checked) { border-color: #c6dfff; background: var(--selected); }
    .choice input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
    .choice input:disabled { opacity: .65; }
    .name { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .meta, .note { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .meta { margin-top: 2px; }
    .price { color: var(--ink); font-size: 13px; font-weight: 650; white-space: nowrap; }
    .maps { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-size: 13px; font-weight: 650; text-decoration: none; }
    .maps:hover { text-decoration: underline; }
    .note { margin-top: 10px; }
    .alert { color: #744c13; background: #fff5df; padding: 10px 12px; border-radius: 10px; }
    .pin { width: 29px; height: 29px; display: grid; place-items: center; border: 2px solid #fff; border-radius: 50%; background: var(--accent); color: white; font-weight: 750; box-shadow: 0 2px 8px #0004; }
    .footer { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 16px 0 0; }
    @media (min-width: 760px) {
      .app { padding: 48px 24px; }
      .layout { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 20px; }
      .mapcard { position: sticky; top: 20px; }
      #map { height: 420px; }
      .slot { padding: 20px; }
    }
    :root {
      --accent: #005b50;
      --canvas: #f4f6f3;
      --selected: #edf7f2;
      --line: #dce5de;
    }
    .trip {
      margin-bottom: 16px;
      padding: 21px 18px;
      background: #123f37;
      color: white;
      border-radius: var(--radius);
    }
    .trip .eyebrow { color: #c1e7d6; }
    .trip .sub { color: #e0eee7; }
    .app { padding-top: 16px; }
    .tabs { background: #e7ede7; }
    .maphead { align-items: baseline; margin-bottom: 8px; }
    .maphint { margin: 0 2px 10px; color: var(--muted); font-size: 13px; }
    #map { height: 180px; }
    .slot { border-radius: 20px; }
    .time { display: inline-block; background: #eef3ef; border-radius: 8px; padding: 5px 8px; }
    .slot h2 { margin-top: 8px; }
    .choice { grid-template-columns: 22px minmax(0, 1fr) auto; padding: 10px 8px; cursor: auto; }
    .choice label { cursor: pointer; }
    .choice label .name, .choice label .meta { display: block; }
    .choice input { margin-top: 3px; }
    .choice:has(input:checked) { border-color: #b1d5c3; }
    .maps { border: 0; background: transparent; padding: 0 5px; justify-content: center; }
    .choice-end { display: grid; justify-items: end; }
    .risk { display: inline-block; margin-top: 6px; padding: 4px 8px; border-radius: 999px; background: #fff0cf; color: #704500; font-size: 12px; font-weight: 700; }
    .pin { width: 36px; height: 36px; }
    .place-sheet {
      position: fixed;
      inset: auto 0 0;
      width: min(100%, 540px);
      max-width: none;
      max-height: 85vh;
      margin: 0 auto;
      padding: 18px 20px max(20px, env(safe-area-inset-bottom));
      border: 0;
      border-radius: 24px 24px 0 0;
      color: var(--ink);
      background: var(--surface);
    }
    .place-sheet::backdrop { background: #101c19a6; }
    .sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
    .sheet-head h2 { margin: 2px 0 8px; font-size: 25px; letter-spacing: -.04em; }
    .sheet-close { border: 0; border-radius: 50%; min-width: 44px; min-height: 44px; background: #edf2ef; color: var(--ink); font-size: 22px; }
    .sheet-copy { margin: 8px 0; color: var(--muted); line-height: 1.5; }
    .sheet-address { margin: 8px 0; line-height: 1.45; }
    body:has(.place-sheet[open]) { overflow: hidden; }
    @media (min-width: 760px) {
      .app { padding-top: 32px; }
      .trip { padding: 30px; }
      #map { height: 390px; }
      .place-sheet { inset: 0; margin: auto; border-radius: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="trip">
      <p class="eyebrow">21–23 tháng 11, 2026</p>
      <h1>Đà Lạt Escape</h1>
      <p class="sub">Team 6 · 6 người · 3 ngày 2 đêm</p>
    </header>
    <nav class="tabs" id="tabs" aria-label="Ngày trong lịch trình"></nav>
    <div class="layout">
      <section class="mapcard" aria-labelledby="map-title">
        <div class="maphead"><h2 id="map-title">Địa điểm đã chọn</h2><span id="count" aria-live="polite"></span></div>
        <p class="maphint">Chạm pin để xem chi tiết và chỉ đường.</p>
        <div id="map" aria-label="Bản đồ địa điểm đã chọn"></div>
        <div class="actions">
          <a id="go" class="action" target="_blank" rel="noopener">Lộ trình cả ngày</a>
          <button id="share" class="action alt" type="button">Chia sẻ</button>
        </div>
      </section>
      <section class="timeline" id="timeline" aria-label="Khung giờ và địa điểm"></section>
    </div>
    <p class="footer">Giá ước tính · Pin tham khảo · Kiểm tra địa điểm trước khi chạy xe.</p>
  </main>
  <dialog id="place-sheet" class="place-sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <form method="dialog"><button class="sheet-close" aria-label="Đóng chi tiết" autofocus>×</button></form>
    </div>
    <p id="sheet-meta" class="sheet-copy"></p>
    <p id="sheet-address" class="sheet-address"></p>
    <p id="sheet-price" class="sheet-copy"></p>
    <p id="sheet-crowd" class="sheet-copy"></p>
    <div class="actions">
      <a id="sheet-directions" class="action" target="_blank" rel="noopener">Chỉ đường</a>
      <a id="sheet-photos" class="action alt" target="_blank" rel="noopener">Ảnh trên Maps</a>
    </div>
  </dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
const places={
ga:["Ga49","Ga49 Dalat 55 Hung Vuong",11.948,108.47,0,"Đã đặt"],
home:["Airbnb","64/6 Dao Duy Tu Da Lat",11.926,108.429,0,"64/6 Đào Duy Từ"],
thenh:["Thênh Thang","Thenh Thang Cafe Da Lat",11.96,108.487,60000,"View đồi · 20–30 phút"],
mountain:["Mountain Chill","Mountain Chill 118 Hung Vuong Da Lat",11.958,108.488,70000,"View rộng · dễ đông"],
rung:["Rừng Na Uy","Rung Na Uy Cafe Da Lat",11.967,108.505,65000,"Nhà gỗ · rừng thông"],
cheo:["Cheo Veooo","Cheo Veooo Da Lat",11.957,108.484,60000,"View đồi · dễ đông"],
dinner:["Dưới Tán Anh Đào","Duoi Tan Anh Dao 29B Hung Vuong Da Lat",11.947,108.472,330000,"Ăn tối · acoustic"],
reo:["Reo 20° Chill","Reo 20 Chill Tuyen Lam Da Lat",11.894,108.427,250000,"SUP · cần đặt trước"],
seen:["The Seen House","The Seen House Tuyen Lam Da Lat",11.896,108.431,70000,"View hồ · nhà kính"],
thong:["Thông Trước Nhà","Thong Truoc Nha 31/13 Duong 3/4 Da Lat",11.917,108.447,65000,"Rừng thông"],
miet:["Miết Miết","Miet Miet Cafe Da Lat",11.918,108.448,70000,"Cabin trong rừng"],
laviet:["Là Việt Coffee","La Viet Coffee Da Lat",11.953,108.438,65000,"Specialty coffee"]
};
const days=[
{label:"21 Th 7",slots:[["08:00–14:30","Tập kết · nghỉ",["ga"],"fixed",""],["15:00–16:00","Nhận phòng",["home"],"fixed",""],["16:00–18:00","Cà phê ngắm cảnh",["thenh","mountain","rung","cheo"],"single","Chọn 1 · bỏ nếu đông"],["18:15–21:30","Ăn tối",["dinner"],"multi","Đã duyệt · chưa đặt bàn"]]},
{label:"22 CN",slots:[["07:00–10:00","Hồ Tuyền Lâm",["reo","seen"],"single","SUP cần xác nhận suất"],["10:00–12:00","Cà phê · thiên nhiên",["seen","thong","miet"],"single","Chọn 1"],["12:00–14:00","Ăn trưa",[],"note","Quán ăn chưa chốt"],["14:00–17:00","Nghỉ / đi thêm",["thong","miet"],"optional","Không bắt buộc"],["18:00–21:30","Buổi tối",["dinner"],"optional","Chỉ đi nếu chưa ghé ngày 21"]]},
{label:"23 Th 2",slots:[["08:00–11:00","Ăn sáng · trả phòng",["home"],"fixed","Checkout 11:00"],["11:00–12:00","Gửi hành lý",[],"note","Cần chốt nơi gửi 6 người đến tối"],["12:00–14:00","Ăn trưa",[],"note","Theo vị trí gửi vali"],["14:00–17:00","Cà phê view rừng",["rung","mountain","cheo","thenh"],"single","Chọn 1 · ưu tiên thuận đường"],["17:00–19:30","Ăn tối · nghỉ",["laviet"],"optional","Là Việt là option cà phê"],["19:30–22:00","Lấy vali · lên xe",[],"note","Xe về 22:00"]]}];
let day=0,selected={};try{selected=JSON.parse(localStorage.getItem("dalat-v2")||"{}")}catch{};const query=new URLSearchParams(location.search).get("plan");if(query)try{selected=JSON.parse(decodeURIComponent(escape(atob(query))))}catch{}
function on(i,id){let slot=days[day].slots[i],k=day+"-"+i;return selected[k]!==undefined?selected[k].includes(id):slot[3]==="fixed"||((slot[3]==="single"||slot[3]==="multi")&&slot[2][0]===id)}
const map=L.map("map",{scrollWheelZoom:false,zoomControl:false}).setView([11.94,108.45],12);L.control.zoom({position:"bottomright"}).addTo(map);L.tileLayer("https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://www.hotosm.org/">HOT</a> · <a href="https://openstreetmap.fr/">OSM France</a>'}).addTo(map);const layer=L.layerGroup().addTo(map);
const placeSheet = document.getElementById("place-sheet");
const crowdNotes = {
  mountain: "Có ghi chú dễ đông. Nhóm nên giữ một quán dự phòng.",
  cheo: "Có ghi chú dễ đông. Nhóm nên giữ một quán dự phòng."
};
const priceLabel = price => price ? "~" + Math.round(price / 1000) + "k ₫" : "Chưa ghi giá";
const mapsSearch = query => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
const mapsDirections = query => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(query) + "&travelmode=driving&dir_action=navigate";

function openPlace(id) {
  const [name, query, , , price, note] = places[id];
  setSheetText("sheet-title", name);
  setSheetText("sheet-meta", note.replace(/ · dễ đông$/, ""));
  setSheetText("sheet-address", query);
  setSheetText("sheet-price", priceLabel(price));
  setSheetText("sheet-crowd", crowdNotes[id] || "Chưa có ghi chú về độ đông.");
  document.getElementById("sheet-photos").href = mapsSearch(query);
  document.getElementById("sheet-directions").href = mapsDirections(query);
  placeSheet.showModal();
}

function setSheetText(id, value) {
  document.getElementById(id).textContent = value;
}

function renderChoice(id, i, mode) {
  const [name, , , , price, note] = places[id];
  const inputId = "place-" + i + "-" + id;
  return `<div class="choice">
    <input id="${inputId}" type="checkbox" data-slot="${i}" data-place="${id}" ${on(i,id) ? "checked" : ""} ${mode === "fixed" ? "disabled" : ""}>
    <label for="${inputId}">
      <span class="name">${name}</span>
      <span class="meta">${note.replace(/ · dễ đông$/, "")}</span>
      ${crowdNotes[id] ? '<span class="risk">Dễ đông</span>' : ""}
    </label>
    <div class="choice-end">
      <span class="price">${price ? priceLabel(price) : "—"}</span>
      <button type="button" class="maps" data-details="${id}" aria-label="Chi tiết ${name}">Chi tiết</button>
    </div>
  </div>`;
}

function render() {
  document.getElementById("tabs").innerHTML = days.map((d, i) =>
    `<button type="button" data-day="${i}" aria-pressed="${day === i}" class="${day === i ? "active" : ""}">
      <span>${d.label.split(" ")[0]}/11</span>${["Thứ Bảy","Chủ nhật","Thứ Hai"][i]}
    </button>`
  ).join("");
  document.querySelectorAll("[data-day]").forEach(button => {
    button.onclick = () => {
      day = Number(button.dataset.day);
      render();
      document.querySelector(`[data-day="${day}"]`).focus({preventScroll:true});
    };
  });

  const slots = days[day].slots;
  document.getElementById("timeline").innerHTML = slots.map(([time, title, ids, mode, note], i) =>
    `<article class="slot">
      <div class="time">${time}</div><h2>${title}</h2>
      ${ids.map(id => renderChoice(id, i, mode)).join("")}
      ${note ? `<div class="note ${mode === "note" ? "alert" : ""}">${note}</div>` : ""}
    </article>`
  ).join("");
  document.querySelectorAll("[data-details]").forEach(button => {
    button.onclick = () => openPlace(button.dataset.details);
  });
  document.querySelectorAll("[data-slot]").forEach(input => {
    input.onchange = () => {
      const i = Number(input.dataset.slot);
      const id = input.dataset.place;
      const [, , ids, mode] = slots[i];
      const previous = ids.filter(place => on(i, place));
      selected[day + "-" + i] = mode === "single" ? (input.checked ? [id] : []) :
        input.checked ? [...new Set([...previous, id])] : previous.filter(place => place !== id);
      localStorage.setItem("dalat-v2", JSON.stringify(selected));
      render();
      document.getElementById(input.id).focus({preventScroll:true});
    };
  });

  const ids = [...new Set(slots.flatMap(([, , ids], i) => ids.filter(id => on(i, id))))];
  layer.clearLayers();
  const coordinates = ids.map(id => [places[id][2], places[id][3]]);
  ids.forEach((id, i) => {
    const name = places[id][0];
    const marker = L.marker(coordinates[i], {
      title: name,
      alt: "Chi tiết " + name,
      icon: L.divIcon({className:"", html:`<div class="pin">${i + 1}</div>`, iconSize:[36,36], iconAnchor:[18,18]})
    }).on("click", () => openPlace(id)).addTo(layer);
    marker.getElement().setAttribute("aria-label", "Chi tiết " + name);
  });
  if (coordinates.length > 1) map.fitBounds(coordinates, {padding:[32,32], maxZoom:16});
  else map.setView(coordinates[0] || [11.94,108.45], 12);
  document.getElementById("count").textContent = ids.length + " điểm";

  const queries = ids.map(id => places[id][1]);
  let url = mapsSearch("Đà Lạt");
  if (queries.length === 1) url = mapsDirections(queries[0]);
  if (queries.length > 1) {
    const params = new URLSearchParams({
      api: "1", origin: queries[0], destination: queries.at(-1), travelmode: "driving"
    });
    if (queries.length > 2) params.set("waypoints", queries.slice(1,-1).join("|"));
    url = "https://www.google.com/maps/dir/?" + params;
  }
  document.getElementById("go").href = url;
}

placeSheet.addEventListener("click", event => {
  if (event.target !== placeSheet) return;
  const rect = placeSheet.getBoundingClientRect();
  if (event.clientY < rect.top || event.clientX < rect.left || event.clientX > rect.right || event.clientY > rect.bottom) placeSheet.close();
});
document.getElementById("share").onclick=async()=>{let url=location.origin+location.pathname+"?plan="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(selected)))));try{await navigator.clipboard.writeText(url);alert("Đã sao chép link")}catch{prompt("Link:",url)}};render();
  </script>
</body>
</html>
