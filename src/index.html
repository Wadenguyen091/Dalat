  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f7;
      --surface: #fff;
      --ink: #1d1d1f;
      --muted: #64646c;
      --accent: #0066cc;
      --line: #e6e6eb;
      --selected: #edf5ff;
      --radius: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button, .choice { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .app { width: min(100%, 1120px); margin: auto; padding: 32px 16px 40px; }
    .trip { margin-bottom: 24px; }
    .eyebrow { margin: 0; color: var(--accent); font-size: 14px; font-weight: 700; }
    h1 { margin: 5px 0 6px; font-size: clamp(38px, 8vw, 68px); letter-spacing: -.058em; line-height: 1.04; }
    .sub { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      border-radius: 16px;
      background: #e8e8ed;
      padding: 4px;
      margin: 0 0 16px;
    }
    .tabs button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .tabs button span { display: block; font-size: 15px; color: var(--ink); }
    .tabs .active { background: var(--surface); box-shadow: 0 1px 4px #0002; }
    .tabs .active span { color: var(--accent); }
    .layout { display: grid; gap: 16px; align-items: start; min-width: 0; }
    .mapcard, .slot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
    .mapcard { padding: 14px; }
    .maphead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 12px; }
    .maphead h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .maphead span { color: var(--muted); font-size: 13px; white-space: nowrap; }
    #map { height: clamp(195px, 31vh, 280px); border-radius: 15px; background: #e8edf1; isolation: isolate; }
    .actions { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; margin-top: 12px; }
    .action {
      display: grid;
      place-items: center;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: 650;
    }
    .action.alt { background: var(--selected); color: var(--accent); }
    .timeline { display: grid; gap: 12px; }
    .slot { padding: 16px; }
    .time { color: var(--muted); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .slot h2 { margin: 4px 0 12px; font-size: 21px; letter-spacing: -.035em; line-height: 1.2; }
    .choice {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      min-height: 56px;
      margin-top: 5px;
      padding: 10px 8px 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .choice:has(input:checked) { border-color: #c6dfff; background: var(--selected); }
    .choice input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
    .choice input:disabled { opacity: .65; }
    .name { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .meta, .note { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .meta { margin-top: 2px; }
    .price { color: var(--ink); font-size: 13px; font-weight: 650; white-space: nowrap; }
    .maps { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-size: 13px; font-weight: 650; text-decoration: none; }
    .maps:hover { text-decoration: underline; }
    .note { margin-top: 10px; }
    .alert { color: #744c13; background: #fff5df; padding: 10px 12px; border-radius: 10px; }
    .pin { width: 29px; height: 29px; display: grid; place-items: center; border: 2px solid #fff; border-radius: 50%; background: var(--accent); color: white; font-weight: 750; box-shadow: 0 2px 8px #0004; }
    .footer { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 16px 0 0; }
    @media (min-width: 760px) {
      .app { padding: 48px 24px; }
      .layout { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 20px; }
      .mapcard { position: sticky; top: 20px; }
      #map { height: 420px; }
      .slot { padding: 20px; }
    }
    :root {
      --accent: #005b50;
      --canvas: #f4f6f3;
      --selected: #edf7f2;
      --line: #dce5de;
    }
    .trip {
      margin-bottom: 16px;
      padding: 21px 18px;
      background: #123f37;
      color: white;
      border-radius: var(--radius);
    }
    .trip .eyebrow { color: #c1e7d6; }
    .trip .sub { color: #e0eee7; }
    .app { padding-top: 16px; }
    .tabs { background: #e7ede7; }
    .maphead { align-items: baseline; margin-bottom: 8px; }
    .maphint { margin: 0 2px 10px; color: var(--muted); font-size: 13px; }
    #map { height: 180px; }
    .slot { border-radius: 20px; }
    .time { display: inline-block; background: #eef3ef; border-radius: 8px; padding: 5px 8px; }
    .slot h2 { margin-top: 8px; }
    .choice { grid-template-columns: 22px minmax(0, 1fr) auto; padding: 10px 8px; cursor: auto; }
    .choice label { cursor: pointer; }
    .choice label .name, .choice label .meta { display: block; }
    .choice input { margin-top: 3px; }
    .choice:has(input:checked) { border-color: #b1d5c3; }
    .maps { border: 0; background: transparent; padding: 0 5px; justify-content: center; }
    .choice-end { display: grid; justify-items: end; }
    .risk { display: inline-block; margin-top: 6px; padding: 4px 8px; border-radius: 999px; background: #fff0cf; color: #704500; font-size: 12px; font-weight: 700; }
    .pin { width: 36px; height: 36px; }
    .place-sheet {
      position: fixed;
      inset: auto 0 0;
      width: min(100%, 540px);
      max-width: none;
      max-height: 85vh;
      margin: 0 auto;
      padding: 18px 20px max(20px, env(safe-area-inset-bottom));
      border: 0;
      border-radius: 24px 24px 0 0;
      color: var(--ink);
      background: var(--surface);
    }
    .place-sheet::backdrop { background: #101c19a6; }
    .sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
    .sheet-head h2 { margin: 2px 0 8px; font-size: 25px; letter-spacing: -.04em; }
    .sheet-close { border: 0; border-radius: 50%; min-width: 44px; min-height: 44px; background: #edf2ef; color: var(--ink); font-size: 22px; }
    .sheet-copy { margin: 8px 0; color: var(--muted); line-height: 1.5; }
    .sheet-address { margin: 8px 0; line-height: 1.45; }
    body:has(.place-sheet[open]) { overflow: hidden; }
    @media (min-width: 760px) {
      .app { padding-top: 32px; }
      .trip { padding: 30px; }
      #map { height: 390px; }
      .place-sheet { inset: 0; margin: auto; border-radius: 24px; }
    }
    .day-area { margin: 2px 0 10px; color: var(--muted); font-size: 14px; }
    .slot-kind { margin: -5px 0 8px; color: var(--muted); font-size: 13px; }
    .badges { display: flex; flex-wrap: wrap; gap: 4px 7px; margin: 4px 0; }
    .source, .status { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); }
    .source svg { width: 14px; height: 14px; }
    .source.ai { color: #6845a0; }
    .source.human, .status.booked { color: var(--accent); }
    .status.approved-not-booked { color: #795013; }
    .choice .maps { min-width: 44px; }
    .sheet-copy:empty { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <header class="trip">
      <p class="eyebrow">21–23 tháng 11, 2026</p>
      <h1>Đà Lạt Escape</h1>
      <p class="sub">Team 6 · 6 người · 3 ngày 2 đêm</p>
    </header>
    <nav class="tabs" id="tabs" aria-label="Ngày trong lịch trình"></nav>
    <div class="layout">
      <section class="mapcard" aria-labelledby="map-title">
        <div class="maphead"><h2 id="map-title">Địa điểm đã chọn</h2><span id="count" aria-live="polite"></span></div>
        <p id="maphint" class="maphint" aria-live="polite">Chạm pin để xem chi tiết và chỉ đường.</p>
        <div id="map" aria-label="Bản đồ địa điểm đã chọn"></div>
        <div class="actions">
          <a id="go" class="action" target="_blank" rel="noopener">Lộ trình cả ngày</a>
          <button id="share" class="action alt" type="button">Chia sẻ</button>
        </div>
      </section>
      <section aria-label="Lịch trình trong ngày">
        <p id="area" class="day-area"></p>
        <div class="timeline" id="timeline"></div>
      </section>
    </div>
    <p class="footer">Giá ước tính theo người. Độ đông và pin chỉ để tham khảo. Ga49 và Airbnb là hai điểm đã đặt.</p>
  </main>
  <dialog id="place-sheet" class="place-sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <form method="dialog"><button class="sheet-close" aria-label="Đóng chi tiết" autofocus>×</button></form>
    </div>
    <p id="sheet-meta" class="sheet-copy"></p>
    <p id="sheet-address" class="sheet-address"></p>
    <p id="sheet-price" class="sheet-copy"></p>
    <p id="sheet-crowd" class="sheet-copy"></p>
    <p id="sheet-note" class="sheet-copy"></p>
    <p class="sheet-copy">Xem ảnh địa điểm trên Google Maps.</p>
    <div class="actions">
      <a id="sheet-directions" class="action" target="_blank" rel="noopener">Chỉ đường</a>
      <a id="sheet-photos" class="action alt" target="_blank" rel="noopener">Ảnh trên Maps</a>
    </div>
  </dialog>

  "uiRules": {

    "showPrice": true,
    "showSourceIcon": true,
    "sourceIcons": {
      "human": "user-round",
      "ai": "sparkles"
    },
    "defaultView": "timeline-and-pin-map",
    "statuses": [
      "booked",
      "approved-not-booked",
      "candidate"
    ],
    "persistSelection": "shareable link or app state",
    "imageRule": "Use licensed/verified place images; do not assume image URLs"
  }

  </script>
  <script>
const plan = JSON.parse(document.getElementById("plan-data").textContent);
const days = plan.days;
const places = new Map(plan.places.map(place => [place.id, place]));
const maxOptions = Math.min(5, plan.uiRules.maxOptionsPerSlot);
const options = slot => slot.options.slice(0, maxOptions);
const storageKey = "dalat-v5";
let day = 0;
let selected = {};

function readSelections(value) {
  const parsed = JSON.parse(value);
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
  return Object.fromEntries(days.flatMap(({slots}) => slots
    .filter(slot => slot.kind !== "fixed" && Array.isArray(parsed[slot.id]))
    .map(slot => [slot.id, options(slot).filter(id => parsed[slot.id].includes(id))])));
}

try { selected = readSelections(localStorage.getItem(storageKey)); } catch {}
const shared = new URLSearchParams(location.search).get("plan");
if (shared) {
  try {
    const raw = JSON.parse(atob(shared));
    if (raw.version === plan.version) selected = readSelections(JSON.stringify(raw.selected));
  } catch {}
}
const checked = (slot, id) => (selected[slot.id] ?? slot.selected).includes(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character =>
  ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[character]);
const dayLabel = date => date.slice(8, 10) + "/" + date.slice(5, 7);
const number = new Intl.NumberFormat("vi-VN");
const priceLabel = price => {
  if (!price) return "Chưa có giá";
  const min = number.format(price.min);
  return (price.min === price.max ? min : min + "–" + number.format(price.max)) + " ₫";
};
const statusLabels = {booked:"Đã đặt", "approved-not-booked":"Đã duyệt · chưa đặt", candidate:"Đề xuất"};
const slotLabels = {fixed:"Đã lên lịch", travel:"Di chuyển", optional:"Tùy chọn", required:"Cần thực hiện", "required-unresolved":"Cần xác nhận"};
const crowdLabels = {
  "high-weekend-evening":"Dễ đông tối cuối tuần",
  "medium-high-weekend":"Có thể đông cuối tuần",
  "high-sunset":"Dễ đông lúc hoàng hôn",
  "medium-uncertain":"Mức đông vừa · chưa chắc chắn"
};
const sourceIcons = {
  human:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="6" r="3"/><path d="M4 17v-1a6 6 0 0 1 12 0v1"/></svg>',
  ai:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m8 2 1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6L8 2Zm7 9 1 2.8 2.8 1L16 16l-1 2.8-1-2.8-2.8-1.2 2.8-1 1-2.8Z"/></svg>'
};
const mapsSearch = query => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
const mapsDirections = query => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(query) + "&travelmode=driving&dir_action=navigate";
const placeQuery = place => place.mapQuery.toLocaleLowerCase("vi").includes(place.name.toLocaleLowerCase("vi"))
  ? place.mapQuery : place.name + ", " + place.mapQuery;
const placeSheet = document.getElementById("place-sheet");
const mapCenter = [11.94,108.45];
const map = L.map("map", {scrollWheelZoom:false, zoomControl:false}).setView(mapCenter, 12);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {
  maxZoom:18,
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://www.hotosm.org/">HOT</a> · <a href="https://openstreetmap.fr/">OSM France</a>'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

function openPlace(id) {
  const place = places.get(id);
  document.getElementById("sheet-title").textContent = place.name;
  document.getElementById("sheet-meta").textContent =
    plan.sourceLegend[place.source].label + " · " + statusLabels[place.status ?? "candidate"];
  document.getElementById("sheet-address").textContent = place.mapQuery;
  document.getElementById("sheet-price").textContent = priceLabel(place.priceEstimate) + (place.priceEstimate ? " / người" : "");
  document.getElementById("sheet-crowd").textContent = crowdLabels[place.crowdRisk] ?
    crowdLabels[place.crowdRisk] + " (ước tính)" : "Chưa có ước tính độ đông.";
  document.getElementById("sheet-note").textContent = place.notes ?? "";
  document.getElementById("sheet-directions").href = mapsDirections(placeQuery(place));
  document.getElementById("sheet-photos").href = mapsSearch(placeQuery(place));
  placeSheet.showModal();
}

function renderChoice(slot, id) {
  const place = places.get(id);
  const inputId = "place-" + slot.id + "-" + id;
  const name = escapeHtml(place.name);
  const risk = crowdLabels[place.crowdRisk];
  const status = place.status ?? "candidate";
  return `<div class="choice">
    <input id="${inputId}" type="checkbox" data-slot="${slot.id}" data-place="${id}" ${checked(slot, id) ? "checked" : ""} ${slot.kind === "fixed" ? "disabled" : ""}>
    <label for="${inputId}">
      <span class="name">${name}</span>
      <span class="badges">
        <span class="source ${place.source}">${sourceIcons[place.source]}${escapeHtml(plan.sourceLegend[place.source].label)}</span>
        <span class="status ${status}">${statusLabels[status]}</span>
      </span>
      <span class="meta">${priceLabel(place.priceEstimate)}${place.priceEstimate ? " / người" : ""}</span>
      ${risk ? '<span class="risk">' + risk + '</span>' : ""}
    </label>
    <div class="choice-end">
      <button type="button" class="maps" data-details="${id}" aria-label="Chi tiết ${name}">Chi tiết</button>
      <a class="maps" target="_blank" rel="noopener" href="${mapsSearch(placeQuery(place))}" aria-label="Google Maps: ${name}">Maps ↗</a>
    </div>
  </div>`;
}

function render() {
  document.getElementById("tabs").innerHTML = days.map((item, i) =>
    `<button type="button" data-day="${i}" aria-pressed="${day === i}" class="${day === i ? "active" : ""}">
      <span>${dayLabel(item.date)}</span>${escapeHtml(item.label)}
    </button>`
  ).join("");
  document.querySelectorAll("[data-day]").forEach(button => {
    button.onclick = () => {
      day = Number(button.dataset.day);
      render();
      document.querySelector(`[data-day="${day}"]`).focus({preventScroll:true});
    };
  });
  const current = days[day];
  document.getElementById("area").textContent = current.area;
  document.getElementById("timeline").innerHTML = current.slots.map(slot =>
    `<article class="slot" data-slot-card="${slot.id}">
      <div class="time">${escapeHtml(slot.time)}</div><h2>${escapeHtml(slot.title)}</h2>
      ${slotLabels[slot.kind] ? '<p class="slot-kind">' + slotLabels[slot.kind] + '</p>' : ""}
      ${options(slot).map(id => renderChoice(slot, id)).join("")}
      ${slot.note ? `<div class="note ${slot.kind === "required-unresolved" ? "alert" : ""}">${escapeHtml(slot.note)}</div>` : ""}
    </article>`
  ).join("");
  document.querySelectorAll("[data-details]").forEach(button => {
    button.onclick = () => openPlace(button.dataset.details);
  });
  document.querySelectorAll("[data-slot]").forEach(input => {
    input.onchange = () => {
      const slot = current.slots.find(item => item.id === input.dataset.slot);
      selected[slot.id] = options(slot).filter(id => id === input.dataset.place ? input.checked : checked(slot, id));
      try { localStorage.setItem(storageKey, JSON.stringify(selected)); } catch {}
      renderMap(current.slots);
    };
  });
  renderMap(current.slots);
}

function renderMap(slots) {
  const ids = [...new Set(slots.flatMap(slot => options(slot).filter(id => checked(slot, id))))];
  const picks = ids.map(id => places.get(id));
  const mappable = picks.filter(place => place.coordinates);
  layer.clearLayers();
  mappable.forEach((place, i) => {
    const marker = L.marker(place.coordinates, {
      title: place.name,
      icon: L.divIcon({className:"", html:`<div class="pin">${i + 1}</div>`, iconSize:[36,36], iconAnchor:[18,18]})
    }).on("click", () => openPlace(place.id)).addTo(layer);
    const pin = marker.getElement();
    pin.setAttribute("aria-label", "Chi tiết " + place.name);
    pin.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      openPlace(place.id);
    });
  });
  if (mappable.length > 1) map.fitBounds(mappable.map(place => place.coordinates), {padding:[32,32], maxZoom:16});
  else map.setView(mappable[0]?.coordinates ?? mapCenter, mappable.length ? 15 : 12);
  document.getElementById("count").textContent = picks.length + " đã chọn";
  const missing = picks.length - mappable.length;
  document.getElementById("maphint").textContent = missing ?
    missing + " điểm chưa có tọa độ. Mở Maps từ lịch trình." :
    mappable.length ? "Chạm pin để xem chi tiết và chỉ đường." : "Chọn địa điểm trong lịch trình để xem pin.";

  const queries = picks.map(placeQuery);
  let url = mapsSearch("Đà Lạt");
  if (queries.length === 1) url = mapsDirections(queries[0]);
  if (queries.length > 1 && queries.length <= 5) {
    const params = new URLSearchParams({
      api:"1", origin:queries[0], destination:queries.at(-1), travelmode:"driving"
    });
    if (queries.length > 2) params.set("waypoints", queries.slice(1,-1).join("|"));
    url = "https://www.google.com/maps/dir/?" + params;
  }
  const go = document.getElementById("go");
  go.href = url;
  go.textContent = queries.length > 1 && queries.length <= 5 ? "Lộ trình cả ngày" : "Google Maps ↗";
}

placeSheet.addEventListener("click", event => {
  if (event.target !== placeSheet) return;
  const rect = placeSheet.getBoundingClientRect();
  if (event.clientY < rect.top || event.clientX < rect.left || event.clientX > rect.right || event.clientY > rect.bottom) placeSheet.close();
});
document.getElementById("share").onclick = async () => {
  const url = new URL(location.pathname, location.origin);
  url.searchParams.set("plan", btoa(JSON.stringify({version:plan.version, selected})));
  try {
    await navigator.clipboard.writeText(url.href);
    alert("Đã sao chép link");
  } catch {
    prompt("Link chia sẻ", url.href);
  }
};
render();
  </script>
