<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Đà Lạt Escape · Team 6</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f7;
      --surface: #fff;
      --ink: #1d1d1f;
      --muted: #64646c;
      --accent: #0066cc;
      --line: #e6e6eb;
      --selected: #edf5ff;
      --radius: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button, .choice { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .app { width: min(100%, 1120px); margin: auto; padding: 32px 16px 40px; }
    .trip { margin-bottom: 24px; }
    .eyebrow { margin: 0; color: var(--accent); font-size: 14px; font-weight: 700; }
    h1 { margin: 5px 0 6px; font-size: clamp(38px, 8vw, 68px); letter-spacing: -.058em; line-height: 1.04; }
    .sub { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      border-radius: 16px;
      background: #e8e8ed;
      padding: 4px;
      margin: 0 0 16px;
    }
    .tabs button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .tabs button span { display: block; font-size: 15px; color: var(--ink); }
    .tabs .active { background: var(--surface); box-shadow: 0 1px 4px #0002; }
    .tabs .active span { color: var(--accent); }
    .layout { display: grid; gap: 16px; align-items: start; min-width: 0; }
    .mapcard, .slot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
    .mapcard { padding: 14px; }
    .maphead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 12px; }
    .maphead h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .maphead span { color: var(--muted); font-size: 13px; white-space: nowrap; }
    #map { height: clamp(195px, 31vh, 280px); border-radius: 15px; background: #e8edf1; isolation: isolate; }
    .actions { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; margin-top: 12px; }
    .action {
      display: grid;
      place-items: center;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: 650;
    }
    .action.alt { background: var(--selected); color: var(--accent); }
    .timeline { display: grid; gap: 12px; }
    .slot { padding: 16px; }
    .time { color: var(--muted); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .slot h2 { margin: 4px 0 12px; font-size: 21px; letter-spacing: -.035em; line-height: 1.2; }
    .choice {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      min-height: 56px;
      margin-top: 5px;
      padding: 10px 8px 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .choice:has(input:checked) { border-color: #c6dfff; background: var(--selected); }
    .choice input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
    .choice input:disabled { opacity: .65; }
    .name { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .meta, .note { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .meta { margin-top: 2px; }
    .price { color: var(--ink); font-size: 13px; font-weight: 650; white-space: nowrap; }
    .maps { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-size: 13px; font-weight: 650; text-decoration: none; }
    .maps:hover { text-decoration: underline; }
    .note { margin-top: 10px; }
    .alert { color: #744c13; background: #fff5df; padding: 10px 12px; border-radius: 10px; }
    .pin { width: 29px; height: 29px; display: grid; place-items: center; border: 2px solid #fff; border-radius: 50%; background: var(--accent); color: white; font-weight: 750; box-shadow: 0 2px 8px #0004; }
    .footer { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 16px 0 0; }
    @media (min-width: 760px) {
      .app { padding: 48px 24px; }
      .layout { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 20px; }
      .mapcard { position: sticky; top: 20px; }
      #map { height: 420px; }
      .slot { padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="trip">
      <p class="eyebrow">21–23 tháng 11, 2026</p>
      <h1>Đà Lạt Escape</h1>
      <p class="sub">Team 6 · 6 người · 3 ngày 2 đêm</p>
    </header>
    <nav class="tabs" id="tabs" aria-label="Ngày trong lịch trình"></nav>
    <div class="layout">
      <section class="mapcard" aria-labelledby="map-title">
        <div class="maphead"><h2 id="map-title">Địa điểm đã chọn</h2><span id="count" aria-live="polite"></span></div>
        <div id="map" aria-label="Bản đồ địa điểm đã chọn"></div>
        <div class="actions">
          <a id="go" class="action" target="_blank" rel="noopener">Google Maps ↗</a>
          <button id="share" class="action alt" type="button">Chia sẻ</button>
        </div>
      </section>
      <section class="timeline" id="timeline" aria-label="Khung giờ và địa điểm"></section>
    </div>
    <p class="footer">Giá ước tính · Pin tham khảo · Kiểm tra địa điểm trước khi chạy xe.</p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
const places={
ga:["Ga49","Ga49 Dalat 55 Hung Vuong",11.948,108.47,0,"Đã đặt"],
home:["Airbnb","64/6 Dao Duy Tu Da Lat",11.926,108.429,0,"64/6 Đào Duy Từ"],
thenh:["Thênh Thang","Thenh Thang Cafe Da Lat",11.96,108.487,60000,"View đồi · 20–30 phút"],
mountain:["Mountain Chill","Mountain Chill 118 Hung Vuong Da Lat",11.958,108.488,70000,"View rộng · dễ đông"],
rung:["Rừng Na Uy","Rung Na Uy Cafe Da Lat",11.967,108.505,65000,"Nhà gỗ · rừng thông"],
cheo:["Cheo Veooo","Cheo Veooo Da Lat",11.957,108.484,60000,"View đồi · dễ đông"],
dinner:["Dưới Tán Anh Đào","Duoi Tan Anh Dao 29B Hung Vuong Da Lat",11.947,108.472,330000,"Ăn tối · acoustic"],
reo:["Reo 20° Chill","Reo 20 Chill Tuyen Lam Da Lat",11.894,108.427,250000,"SUP · cần đặt trước"],
seen:["The Seen House","The Seen House Tuyen Lam Da Lat",11.896,108.431,70000,"View hồ · nhà kính"],
thong:["Thông Trước Nhà","Thong Truoc Nha 31/13 Duong 3/4 Da Lat",11.917,108.447,65000,"Rừng thông"],
miet:["Miết Miết","Miet Miet Cafe Da Lat",11.918,108.448,70000,"Cabin trong rừng"],
laviet:["Là Việt Coffee","La Viet Coffee Da Lat",11.953,108.438,65000,"Specialty coffee"]
};
const days=[
{label:"21 Th 7",slots:[["08:00–14:30","Tập kết · nghỉ",["ga"],"fixed",""],["15:00–16:00","Nhận phòng",["home"],"fixed",""],["16:00–18:00","Cà phê ngắm cảnh",["thenh","mountain","rung","cheo"],"single","Chọn 1 · bỏ nếu đông"],["18:15–21:30","Ăn tối",["dinner"],"multi","Đã duyệt · chưa đặt bàn"]]},
{label:"22 CN",slots:[["07:00–10:00","Hồ Tuyền Lâm",["reo","seen"],"single","SUP cần xác nhận suất"],["10:00–12:00","Cà phê · thiên nhiên",["seen","thong","miet"],"single","Chọn 1"],["12:00–14:00","Ăn trưa",[],"note","Quán ăn chưa chốt"],["14:00–17:00","Nghỉ / đi thêm",["thong","miet"],"optional","Không bắt buộc"],["18:00–21:30","Buổi tối",["dinner"],"optional","Chỉ đi nếu chưa ghé ngày 21"]]},
{label:"23 Th 2",slots:[["08:00–11:00","Ăn sáng · trả phòng",["home"],"fixed","Checkout 11:00"],["11:00–12:00","Gửi hành lý",[],"note","Cần chốt nơi gửi 6 người đến tối"],["12:00–14:00","Ăn trưa",[],"note","Theo vị trí gửi vali"],["14:00–17:00","Cà phê view rừng",["rung","mountain","cheo","thenh"],"single","Chọn 1 · ưu tiên thuận đường"],["17:00–19:30","Ăn tối · nghỉ",["laviet"],"optional","Là Việt là option cà phê"],["19:30–22:00","Lấy vali · lên xe",[],"note","Xe về 22:00"]]}];
let day=0,selected={};try{selected=JSON.parse(localStorage.getItem("dalat-v2")||"{}")}catch{};const query=new URLSearchParams(location.search).get("plan");if(query)try{selected=JSON.parse(decodeURIComponent(escape(atob(query))))}catch{}
function on(i,id){let slot=days[day].slots[i],k=day+"-"+i;return selected[k]!==undefined?selected[k].includes(id):slot[3]==="fixed"||((slot[3]==="single"||slot[3]==="multi")&&slot[2][0]===id)}
const map=L.map("map",{scrollWheelZoom:false,zoomControl:false}).setView([11.94,108.45],12);L.control.zoom({position:"bottomright"}).addTo(map);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);const layer=L.layerGroup().addTo(map);
function render(){document.getElementById("tabs").innerHTML=days.map((d,i)=>'<button type="button" data-day="'+i+'" aria-pressed="'+(day===i)+'" class="'+(day===i?"active":"")+'"><span>'+d.label.split(" ")[0]+'/11</span>'+["Thứ Bảy","Chủ nhật","Thứ Hai"][i]+'</button>').join("");document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{day=+b.dataset.day;render();document.querySelector("[data-day=\""+day+"\"]").focus({preventScroll:true})});document.getElementById("timeline").innerHTML=days[day].slots.map((s,i)=>'<article class="slot"><div class="time">'+s[0]+'</div><h2>'+s[1]+'</h2>'+s[2].map((id,j)=>{let p=places[id];return '<label class="choice"><input type="checkbox" data-slot="'+i+'" data-place="'+id+'" '+(on(i,id)?"checked":"")+' '+(s[3]==="fixed"?"disabled":"")+'><div class="details"><div class="name">'+p[0]+'</div><div class="meta">'+p[5]+'</div><a class="maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[1])+'">Xem địa điểm ↗</a></div><span class="price">'+(p[4]?"~"+Math.round(p[4]/1000)+"k":"—")+'</span></label>'}).join("")+(s[4]?'<div class="note '+(s[3]==="note"?"alert":"")+'">'+s[4]+'</div>':"")+'</article>').join("");document.querySelectorAll("[data-slot]").forEach(el=>el.onchange=()=>{const i=+el.dataset.slot,s=days[day].slots[i],k=day+"-"+i,old=s[2].filter(id=>on(i,id));selected[k]=s[3]==="single"?(el.checked?[el.dataset.place]:[]):el.checked?[...new Set([...old,el.dataset.place])]:old.filter(id=>id!==el.dataset.place);localStorage.setItem("dalat-v2",JSON.stringify(selected));render();document.querySelector("[data-slot=\""+i+"\"][data-place=\""+el.dataset.place+"\"]").focus({preventScroll:true})});const ids=[...new Set(days[day].slots.flatMap((s,i)=>s[2].filter(id=>on(i,id))))];layer.clearLayers();const points=ids.map(id=>places[id]);points.forEach((p,i)=>L.marker([p[2],p[3]],{icon:L.divIcon({className:"",html:'<div class="pin">'+(i+1)+'</div>',iconSize:[29,29],iconAnchor:[14,14]})}).bindPopup('<b>'+p[0]+'</b><br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[1])+'">Google Maps ↗</a>').addTo(layer));if(points.length>1)map.fitBounds(points.map(p=>[p[2],p[3]]),{padding:[35,35],maxZoom:13});else if(points.length)map.setView([points[0][2],points[0][3]],12);document.getElementById("count").textContent=ids.length+" điểm";let url="https://www.google.com/maps/search/?api=1&query=Da%20Lat";if(points.length===1)url="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(points[0][1]);else if(points.length>1)url="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(points[0][1])+"&destination="+encodeURIComponent(points.at(-1)[1])+(points.length>2?"&waypoints="+encodeURIComponent(points.slice(1,-1).map(p=>p[1]).join("|")):"")+"&travelmode=driving";document.getElementById("go").href=url;setTimeout(()=>map.invalidateSize(),100)}
document.getElementById("share").onclick=async()=>{let url=location.origin+location.pathname+"?plan="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(selected)))));try{await navigator.clipboard.writeText(url);alert("Đã sao chép link")}catch{prompt("Link:",url)}};render();
  </script>
</body>
</html>
