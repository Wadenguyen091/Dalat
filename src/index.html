  <script>
/**
 * @typedef {{src:string, thumbnail:string, alt:string, source:string, credit:string}} PlacePhoto
 * @typedef {{id:string, name:string, source:"human"|"ai", mapQuery:string, priceEstimate:{min:number,max:number}|null,
 * status?:string, crowdRisk?:string, notes?:string, google?:{id:string,address:string,addressOnly?:boolean,referenceLabel?:string},
 * position?:{coordinates:L.LatLngTuple,source:string}, hours?:string, photos?:PlacePhoto[]}} Place
 * @typedef {{id:string, time:string, title:string, kind:string, options:string[], selected:string[], note?:string, selectionFrom?:string}} Slot
 * @typedef {{date:string,label:string,area:string,slots:Slot[]}} TripDay
 */
/** @type {{version:string, days:TripDay[], places:Place[], uiRules:{maxOptionsPerSlot:number}, sourceLegend:Record<string,{label:string}>}} */
const plan = JSON.parse(document.getElementById("plan-data").textContent);
const days = plan.days;
const places = new Map(plan.places.map(place => [place.id, place]));
const maxOptions = Math.min(5, plan.uiRules.maxOptionsPerSlot);
const options = slot => slot.options.slice(0, maxOptions);
const storageKey = "dalat-v5";
let day = 0;
let selected = {};

function readSelections(value) {
  const parsed = JSON.parse(value);
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
  return Object.fromEntries(days.flatMap(({slots}) => slots.flatMap(slot => {
    const choices = parsed[slot.id] ?? (slot.selectionFrom ? parsed[slot.selectionFrom] : undefined);
    if (slot.kind === "fixed" || !Array.isArray(choices)) return [];
    return [[slot.id, options(slot).filter(id => choices.includes(id))]];
  })));
}

try { selected = readSelections(localStorage.getItem(storageKey)); } catch {}
const shared = new URLSearchParams(location.search).get("plan");
if (shared) {
  try {
    const raw = JSON.parse(atob(shared));
    if (raw.version === plan.version) selected = readSelections(JSON.stringify(raw.selected));
  } catch {}
}
const checked = (slot, id) => (selected[slot.id] ?? slot.selected).includes(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character =>
  ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[character]);
const number = new Intl.NumberFormat("vi-VN");
const priceLabel = price => {
  if (!price) return "Chưa có giá";
  const min = number.format(price.min);
  return (price.min === price.max ? min : min + "–" + number.format(price.max)) + " ₫";
};
const statusLabels = {booked:"Đã đặt", "approved-not-booked":"Đã duyệt · chưa đặt", candidate:"Đề xuất"};
const slotNotes = {
  "21-05": "Có thể bỏ qua nếu đi ăn xế.",
  "21-06": "Rừng Lá Kim lệch tuyến.",
  "22-03": "Chèo SUP khi đã đặt chỗ và thời tiết phù hợp.",
  "22-05": "Các quán đều cần đi vòng hoặc quay lại.",
  "22-08": "Nếu đã ăn ở Dưới Tán Anh Đào, ưu tiên quán khác.",
  "23-03": "Chốt chỗ gửi vali cho 6 người đến 20:00–20:30.",
  "23-05": "Chọn một quán sau khi chốt chỗ gửi vali và điểm đón xe.",
  "23-06": "Là Việt là điểm uống cà phê.",
  "23-07": "Xe chạy 22:00 · Chưa chốt điểm đón."
};
const placeNotes = {
  "duoi-tan": "Xác nhận lịch acoustic và đặt bàn 6 người.",
  reo: "Đặt 6 suất SUP và kiểm tra thời tiết."
};
const crowdLabels = {
  "high-weekend-evening":"Dễ đông tối cuối tuần",
  "medium-high-weekend":"Có thể đông cuối tuần",
  "high-sunset":"Dễ đông lúc hoàng hôn",
  "medium-uncertain":"Mức đông vừa · chưa chắc chắn"
};
const icon = name => `<svg class="icon" aria-hidden="true" focusable="false"><use href="#lucide-${name}"></use></svg>`;
const locationNotes = {
  airbnb: "Chỉ đường tới số 64. Địa chỉ lưu trú là căn 64/6."
};
function placeQuery(place) {
  const listing = place.google;
  if (!listing) return place.mapQuery;
  return listing.addressOnly ? listing.address : place.name + ", " + listing.address;
}
function directionLabel(place) {
  if (place.google?.referenceLabel) return "Tới " + place.google.referenceLabel;
  return place.google ? "Chỉ đường" : "Tra địa chỉ";
}
function mapsSearch(place) {
  const params = new URLSearchParams({api:"1", query:placeQuery(place)});
  if (place.google) params.set("query_place_id", place.google.id);
  return "https://www.google.com/maps/search/?" + params;
}
/** @param {Place[]} stops */
function mapsDirections(stops) {
  const first = stops[0];
  const last = stops.at(-1);
  const params = new URLSearchParams({
    api:"1", destination:placeQuery(last), destination_place_id:last.google.id, travelmode:"driving"
  });
  if (stops.length === 1) params.set("dir_action", "navigate");
  else {
    params.set("origin", placeQuery(first));
    params.set("origin_place_id", first.google.id);
    const via = stops.slice(1,-1);
    if (via.length) {
      params.set("waypoints", via.map(placeQuery).join("|"));
      params.set("waypoint_place_ids", via.map(place => place.google.id).join("|"));
    }
  }
  return "https://www.google.com/maps/dir/?" + params;
}
function placeLink(place) {
  return place.google ? mapsDirections([place]) : mapsSearch(place);
}
const placeSheet = /** @type {HTMLDialogElement} */ (document.getElementById("place-sheet"));
const app = /** @type {HTMLElement} */ (document.querySelector(".app"));

/** @type {{map: L.Map, pins: L.LayerGroup} | undefined} */
let overview;
const mapElement = /** @type {HTMLDivElement} */ (document.getElementById("map"));
const mapCenter = /** @type {L.LatLngTuple} */ ([11.94, 108.45]);
const showMap = /** @type {HTMLButtonElement} */ (document.getElementById("show-map"));
const returnToPlan = /** @type {HTMLButtonElement} */ (document.querySelector("[data-view-target='timeline']"));
let planScroll = 0;

function switchView(view) {
  if (app.dataset.view === view) return;
  if (view === "map") planScroll = window.scrollY;
  app.dataset.view = view;
  document.getElementById("page-title").textContent = view === "map" ? "Bản đồ" : "Da Lat Escape";
  if (view === "map") {
    window.scrollTo(0, 0);
    renderMap(days[day].slots);
    returnToPlan.focus({preventScroll:true});
  } else {
    window.scrollTo(0, planScroll);
    showMap.focus({preventScroll:true});
  }
}

showMap.addEventListener("click", () => {
  history.pushState({fromPlan:true}, "", "#ban-do");
  switchView("map");
});
returnToPlan.addEventListener("click", () => {
  if (history.state?.fromPlan) history.back();
  else {
    history.replaceState(null, "", location.pathname + location.search);
    switchView("timeline");
  }
});
window.addEventListener("popstate", () => switchView(location.hash === "#ban-do" ? "map" : "timeline"));

/** Media entries are attached to the matching place in the itinerary data. */
/** @param {PlacePhoto|undefined} photo */
function placeMedia(photo, thumbnail = false) {
  if (!photo) return `<span class="place-media" aria-label="Chưa có ảnh địa điểm" role="img">${icon("image")}</span>`;
  return `<span class="place-media"><img src="${escapeHtml(thumbnail ? photo.thumbnail : photo.src)}" alt="${escapeHtml(photo.alt)}" loading="lazy" decoding="async"></span>`;
}

function openPlace(id) {
  const place = places.get(id);
  if (!place) return;
  const photos = place.photos ?? [];
  document.getElementById("sheet-media").innerHTML = placeMedia(photos[0]);
  const gallery = document.getElementById("sheet-gallery");
  gallery.hidden = photos.length < 2;
  gallery.innerHTML = photos.slice(1).map(photo => placeMedia(photo)).join("");
  document.getElementById("sheet-title").textContent = place.name;
  document.getElementById("sheet-meta").textContent = statusLabels[place.status] ?? "";
  document.getElementById("sheet-address").innerHTML = icon("map-pin") + escapeHtml(place.google?.referenceLabel ? place.mapQuery : place.google?.address ?? place.mapQuery);
  document.getElementById("sheet-hours").innerHTML = place.hours ? icon("clock") + escapeHtml(place.hours) : "";
  document.getElementById("sheet-price").textContent = place.priceEstimate ? "Khoảng " + priceLabel(place.priceEstimate) + " / người" : "";
  document.getElementById("sheet-crowd").textContent = crowdLabels[place.crowdRisk] ?
    crowdLabels[place.crowdRisk] + " (ước tính)" : "";
  document.getElementById("sheet-note").textContent = placeNotes[place.id] ?? place.notes ?? "";
  document.getElementById("sheet-location").textContent = locationNotes[place.id] ?? "";
  const directions = /** @type {HTMLAnchorElement} */ (document.getElementById("sheet-directions"));
  directions.href = placeLink(place);
  directions.innerHTML = icon(place.google ? "navigation" : "map-pin") + escapeHtml(directionLabel(place));
  if (!placeSheet.open) placeSheet.showModal();
  placeSheet.scrollTop = 0;
}

function renderChoice(slot, id) {
  const place = places.get(id);
  const inputId = "place-" + slot.id + "-" + id;
  const name = escapeHtml(place.name);
  const status = place.status ?? "candidate";
  return `<div class="choice">
    <button type="button" class="place-button" data-details="${id}" aria-label="Chi tiết ${name}">
      ${placeMedia(place.photos?.[0], true)}
      <span>
        <span class="name">${name}</span>
        ${status !== "candidate" ? `<span class="status ${status}">${statusLabels[status]}</span>` : ""}
      </span>
    </button>
    <label class="pick" for="${inputId}">
      <input id="${inputId}" type="checkbox" aria-label="${name}" data-slot="${slot.id}" data-place="${id}" ${checked(slot, id) ? "checked" : ""} ${slot.kind === "fixed" ? "disabled" : ""}>
    </label>
  </div>`;
}

function render() {
  document.getElementById("tabs").innerHTML = days.map((item, i) =>
    `<button type="button" data-day="${i}" aria-pressed="${day === i}" aria-label="${escapeHtml(item.label)}, ${item.date.slice(8)}/${item.date.slice(5, 7)}" class="${day === i ? "active" : ""}">
      ${item.date.slice(8)}/${item.date.slice(5, 7)}
    </button>`
  ).join("");
  (/** @type {NodeListOf<HTMLButtonElement>} */ (document.querySelectorAll("[data-day]"))).forEach(button => {
    button.onclick = () => {
      day = Number(button.dataset.day);
      render();
      (/** @type {HTMLButtonElement} */ (document.querySelector(`[data-day="${day}"]`))).focus({preventScroll:true});
    };
  });
  const current = days[day];
  document.getElementById("timeline").innerHTML = current.slots.map(slot =>
    `<article class="slot" data-slot-card="${slot.id}">
      <header class="slot-header">
        <div class="slot-time-row">
          <p class="time">${escapeHtml(slot.time)}</p>
          ${slot.note ? `<details class="slot-note" name="slot-notes">
            <summary aria-label="Ghi chú: ${escapeHtml(slot.title)}">${icon("info")}</summary>
            <p class="slot-tooltip">${escapeHtml(slotNotes[slot.id] ?? slot.note)}</p>
          </details>` : ""}
        </div>
        <h2>${escapeHtml(slot.title)}</h2>
      </header>
      <div class="place-list">${options(slot).map(id => renderChoice(slot, id)).join("")}</div>
    </article>`
  ).join("");
  (/** @type {NodeListOf<HTMLButtonElement>} */ (document.querySelectorAll("[data-details]"))).forEach(button => {
    button.onclick = () => openPlace(button.dataset.details);
  });
  (/** @type {NodeListOf<HTMLInputElement>} */ (document.querySelectorAll("[data-slot]"))).forEach(input => {
    input.onchange = () => {
      const slot = current.slots.find(item => item.id === input.dataset.slot);
      selected[slot.id] = options(slot).filter(id => id === input.dataset.place ? input.checked : checked(slot, id));
      try { localStorage.setItem(storageKey, JSON.stringify(selected)); } catch {}
      renderMap(current.slots);
    };
  });
  renderMap(current.slots);
}

/** @param {Place[]} stops */
function renderRoute(stops) {
  const actions = document.getElementById("route-actions");
  const missing = [...new Set(stops.filter(place => !place.google).map(place => place.name))];
  const segments = [];
  let segment = [];
  for (const stop of stops) {
    if (!stop.google || segment.length === 5) {
      if (segment.length > 1) segments.push(segment);
      segment = stop.google ? segment.slice(-1) : [];
    }
    if (stop.google) segment.push(stop);
  }
  if (segment.length > 1) segments.push(segment);
  const complete = !missing.length && stops.length <= 5;
  const stopName = place => place.google.referenceLabel ? "Mốc " + place.google.referenceLabel : place.name;
  const notes = missing.length ? [`Cần xác nhận: ${missing.join(" và ")}.`] : [];
  const references = [...new Set(segments.flat().filter(place => place.google.referenceLabel))];
  for (const place of references) notes.push(`Tuyến dùng mốc ${place.google.referenceLabel} cho ${place.name}.`);
  actions.innerHTML = notes.map(note => `<p class="route-note alert">${escapeHtml(note)}</p>`).join("") +
    segments.map((items, i) =>
      `<div class="actions"><a class="action" target="_blank" rel="noopener" href="${escapeHtml(mapsDirections(items))}">${icon("navigation")}${complete ?
        "Lộ trình cả ngày" : "Chặng " + (i + 1) + " · " + escapeHtml(stopName(items[0])) + " → " + escapeHtml(stopName(items.at(-1)))}</a></div>`
    ).join("");
}

/** @param {Slot[]} slots */
function renderMap(slots) {
  if (app.dataset.view !== "map") return;
  const ids = slots.flatMap(slot => options(slot).filter(id => checked(slot, id)));
  const stops = ids.filter((id, i) => id !== ids[i - 1]).map(id => places.get(id));
  const picks = [...new Set(stops)];
  const known = picks.filter(place => place.position);
  const missing = picks.length - known.length;
  document.getElementById("count").textContent = picks.length + " địa điểm";
  document.getElementById("maphint").textContent = !picks.length ? "Chưa chọn địa điểm." :
    missing ? missing + " điểm chưa có pin." : "";
  const list = document.getElementById("map-list");
  list.hidden = !picks.length;
  list.innerHTML = picks.map((place, i) =>
    `<div class="map-place">
      <button type="button" class="place-button" data-map-details="${place.id}" aria-label="Chi tiết ${escapeHtml(place.name)}">
        ${placeMedia(place.photos?.[0], true)}
        <span class="name">${i + 1}. ${escapeHtml(place.name)}</span>
      </button>
      <a class="action alt" data-map-directions="${place.id}" target="_blank" rel="noopener" href="${escapeHtml(placeLink(place))}"
        aria-label="${escapeHtml(directionLabel(place))}: ${escapeHtml(place.name)}">${icon(place.google ? "navigation" : "map-pin")}${escapeHtml(directionLabel(place))}</a>
    </div>`
  ).join("");
  list.querySelectorAll("[data-map-details]").forEach(button =>
    button.addEventListener("click", () => openPlace(button.getAttribute("data-map-details")))
  );
  renderRoute(stops);
  if (typeof L === "undefined") {
    mapElement.textContent = "Bản đồ chưa tải được.";
    return;
  }
  if (!overview) {
    const map = L.map(mapElement, {scrollWheelZoom:false, zoomControl:false}).setView(mapCenter, 12);
    L.control.zoom({position:"topright"}).addTo(map);
    L.tileLayer("https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {
      maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · HOT · OSM France'
    }).addTo(map);
    overview = {map, pins:L.layerGroup().addTo(map)};
  }
  const {map, pins} = overview;
  map.invalidateSize({pan:false});
  pins.clearLayers();
  known.forEach(place => {
    const number = picks.indexOf(place) + 1;
    const markerTitle = place.google?.referenceLabel ? place.name + " (mốc " + place.google.referenceLabel + ")" : place.name;
    const marker = L.marker(place.position.coordinates, {
      title: markerTitle,
      icon: L.divIcon({className:"map-pin", html:`<span>${number}</span>`, iconSize:[44,44], iconAnchor:[22,22]})
    }).on("click", () => openPlace(place.id)).addTo(pins);
    const pin = marker.getElement();
    pin.setAttribute("aria-label", number + ". " + markerTitle);
    pin.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      openPlace(place.id);
    });
  });
  if (known.length > 1) map.fitBounds(known.map(place => place.position.coordinates), {padding:[28,28], maxZoom:18});
  else map.setView(known[0]?.position.coordinates ?? mapCenter, known.length ? 15 : 12);
}

document.addEventListener("click", event => {
  const target = event.target;
  if (!(target instanceof Node)) return;
  document.querySelectorAll("details.slot-note[open]").forEach(note => {
    if (!note.contains(target)) note.removeAttribute("open");
  });
});

document.addEventListener("keydown", event => {
  if (event.key !== "Escape" || placeSheet.open) return;
  const summary = document.querySelector("details.slot-note[open] > summary");
  if (!(summary instanceof HTMLElement)) return;
  summary.parentElement.removeAttribute("open");
  summary.focus({preventScroll:true});
});

placeSheet.addEventListener("click", event => {
  if (event.target !== placeSheet) return;
  const rect = placeSheet.getBoundingClientRect();
  if (event.clientY < rect.top || event.clientX < rect.left || event.clientX > rect.right || event.clientY > rect.bottom) placeSheet.close();
});
document.getElementById("share").onclick = async () => {
  const url = new URL(location.pathname, location.origin);
  url.searchParams.set("plan", btoa(JSON.stringify({version:plan.version, selected})));
  try {
    await navigator.clipboard.writeText(url.href);
    alert("Đã sao chép link");
  } catch {
    prompt("Link chia sẻ", url.href);
  }
};
render();
if (location.hash === "#ban-do") switchView("map");
  </script>
