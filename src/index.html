  <style>
:root {
  color-scheme: light;
  --paper: #faf9f5;
  --surface: #fff;
  --ink: #182923;
  --muted: #53625a;
  --accent: #1e634d;
  --wash: #eaf3ed;
  --line: #e0e6df;
  --radius: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); }
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid #367b66; outline-offset: 3px; }
.app { max-width: 1090px; margin: auto; padding: 0 18px 100px; }
.trip {
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: 8px;
  align-items: start;
  margin: 18px 0 14px;
  padding: 25px 16px;
  border-radius: 23px;
  color: white;
  background-color: #1b3b2d;
  background-image: linear-gradient(90deg, #142c20 5%, #142c20c9 48%, #142c2066), url("https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Da_Lat_-_Xuan_Huong_Lake.jpg/960px-Da_Lat_-_Xuan_Huong_Lake.jpg");
  background-size: cover;
  background-position: center 52%;
}
.trip .eyebrow, .trip .sub { color: #e5efe8; }
.eyebrow { margin: 0 0 7px; color: var(--accent); font-size: 13px; font-weight: 750; }
h1 { margin: 0; font-size: clamp(32px, 8.2vw, 62px); letter-spacing: -.065em; line-height: 1.05; }
.sub { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.share { margin-top: 6px; }
.tabs { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; margin: 0 0 21px; }
.tabs button { display: grid; gap: 3px; min-height: 62px; place-content: center; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 650; }
.tabs button span { color: var(--ink); font-size: 19px; font-weight: 780; letter-spacing: -.035em; }
.tabs .active { background: var(--accent); border-color: var(--accent); color: #e0f4e6; }
.tabs .active span { color: white; }
.day-area { color: var(--muted); margin: 0 0 14px; font-size: 13px; line-height: 1.5; }
.timeline { display: grid; gap: 16px; }
.slot { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 15px; }
.slot-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.time { color: var(--accent); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
.slot h2 { margin: 4px 0 9px; font-size: 21px; letter-spacing: -.04em; line-height: 1.18; }
.slot-kind { margin: 0; color: var(--muted); font-size: 12px; }
.choice { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 5px; border-top: 1px solid var(--line); padding: 7px 0; }
.choice:last-child { padding-bottom: 0; }
.choice:has(input:checked) .name { color: var(--accent); }
.pick { display: grid; place-items: center; width: 44px; height: 44px; cursor: pointer; }
.pick input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.pick:has(input:disabled) { cursor: default; }
.name { display: block; font-size: 15px; font-weight: 740; line-height: 1.3; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 7px; margin-top: 4px; }
.source, .status { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 650; color: var(--muted); }
.source svg { width: 13px; height: 13px; }
.source.ai { color: #63468b; }
.source.human, .status.booked { color: var(--accent); }
.status.approved-not-booked { color: #785019; }
.meta, .note { color: var(--muted); font-size: 12px; line-height: 1.45; }
.meta { display: block; margin-top: 4px; }
.note { margin-top: 10px; }
.alert, .risk { color: #73470c; background: #fbefd7; }
.alert { padding: 9px 11px; border-radius: 10px; }
.risk { display: inline-block; margin-top: 5px; padding: 3px 6px; border-radius: 6px; font-size: 11px; font-weight: 650; }
.choice-end { display: flex; flex-direction: column; justify-content: center; }
.maps, .action { display: inline-flex; justify-content: center; align-items: center; min-height: 44px; border: 0; text-decoration: none; text-align: center; color: var(--accent); font-size: 13px; font-weight: 700; }
.maps { padding: 0 6px; background: transparent; }
.action { padding: 8px 13px; border-radius: 99px; background: var(--accent); color: white; }
.action.alt { background: var(--wash); color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions .action { flex: 1; }
.mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px; }
.maphead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.maphead h2 { margin: 0; font-size: 21px; letter-spacing: -.035em; }
.maphead span, .maphint { color: var(--muted); font-size: 13px; }
.maphint { line-height: 1.45; margin: 8px 0 10px; }
.map-frame { width: 100%; height: 265px; display: block; border: 1px solid var(--line); border-radius: 14px; background: var(--wash); }
.map-list { display: grid; margin-top: 10px; }
.map-place { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px; align-items: center; border-bottom: 1px solid var(--line); }
.map-place button:first-child { display: flex; align-items: center; gap: 7px; text-align: left; border: 0; border-radius: 8px; background: none; color: var(--ink); font-size: 14px; min-height: 44px; padding: 7px; }
.map-place button[aria-pressed="true"] { background: var(--wash); color: var(--accent); font-weight: 700; }
.map-place svg, .dock svg, .share svg { flex: none; width: 19px; height: 19px; }
.dock { position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; border-top: 1px solid var(--line); background: var(--surface); padding: 7px 18px max(8px, env(safe-area-inset-bottom)); }
.dock button { display: flex; justify-content: center; align-items: center; gap: 7px; min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 700; }
.dock button[aria-pressed="true"] { background: var(--wash); color: var(--accent); }
.footer { margin: 17px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.place-sheet { position: fixed; inset: auto 0 0; width: min(100%, 540px); max-width: none; max-height: 85vh; margin: 0 auto; padding: 18px 20px max(20px, env(safe-area-inset-bottom)); border: 0; border-radius: 24px 24px 0 0; color: var(--ink); background: var(--surface); }
.place-sheet::backdrop { background: #14221cab; }
.sheet-head { display: flex; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 2px 0 8px; font-size: 25px; letter-spacing: -.04em; }
.sheet-close { border: 0; border-radius: 50%; min-width: 44px; min-height: 44px; background: var(--wash); color: var(--ink); font-size: 22px; }
.sheet-copy, .sheet-address { margin: 8px 0; font-size: 14px; line-height: 1.5; }
.sheet-copy { color: var(--muted); }
.sheet-copy:empty { display: none; }
body:has(.place-sheet[open]) { overflow: hidden; }
[hidden] { display: none !important; }
@media (max-width: 759px) {
  .app[data-view="timeline"] .mapcard, .app[data-view="map"] .day-panel { display: none; }
}
@media (min-width: 760px) {
  .app { padding: 0 26px 36px; }
  .trip { margin-top: 28px; padding: 32px; }
  .layout { display: grid; grid-template-columns: minmax(0,1.18fr) minmax(0,1fr); align-items: start; gap: 22px; }
  .mapcard { grid-column: 2; grid-row: 1; }
  .day-panel { grid-column: 1; grid-row: 1; }
  .slot { padding: 17px; }
  .map-frame { height: 290px; }
  .dock { display: none; }
  .place-sheet { inset: 0; margin: auto; border-radius: 24px; }
}
  </style>
</head>

  <main class="app" data-view="timeline">
    <header class="trip">
      <div>
        <p class="eyebrow">21–23 tháng 11, 2026</p>

      </div>
      <button id="share" class="action alt share" type="button" aria-label="Chia sẻ lịch trình" title="Chia sẻ lịch trình"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M6 11H4v10h16V11h-2"/></svg></button>
    </header>
    <nav class="tabs" id="tabs" aria-label="Ngày trong lịch trình"></nav>
    <div class="layout">
      <section class="day-panel" aria-label="Lịch trình trong ngày">
        <p id="area" class="day-area"></p>
        <div class="timeline" id="timeline"></div>
      </section>
      <section class="mapcard" aria-labelledby="map-title">

        <p id="maphint" class="maphint" aria-live="polite"></p>
        <iframe id="map" class="map-frame" title="Google Maps" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
        <div id="map-list" class="map-list"></div>
        <div class="actions"><a id="go" class="action" target="_blank" rel="noopener">Mở Google Maps</a></div>
      </section>
    </div>
    <p class="footer">Giá và độ đông ước tính. Ga49 và Airbnb là hai điểm đã đặt. Ảnh Hồ Xuân Hương của <a href="https://commons.wikimedia.org/wiki/File:Da_Lat_-_Xuan_Huong_Lake.jpg">P. Hughes</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, cắt khung).</p>
    <nav class="dock" aria-label="Chế độ xem">
      <button type="button" data-view-target="timeline" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Lịch trình</button>
      <button type="button" data-view-target="map" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M19 10c0 5-7 10-7 10s-7-5-7-10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Bản đồ</button>
    </nav>
  </main>
  <dialog id="place-sheet" class="place-sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <form method="dialog"><button class="sheet-close" aria-label="Đóng chi tiết" autofocus>×</button></form>
    </div>
    <p id="sheet-meta" class="sheet-copy"></p>
    <p id="sheet-address" class="sheet-address"></p>
    <p id="sheet-price" class="sheet-copy"></p>
    <p id="sheet-crowd" class="sheet-copy"></p>
    <p id="sheet-note" class="sheet-copy"></p>
    <p class="sheet-copy">Xem ảnh địa điểm trên Google Maps.</p>
    <div class="actions">
      <a id="sheet-directions" class="action" target="_blank" rel="noopener">Chỉ đường</a>
      <a id="sheet-photos" class="action alt" target="_blank" rel="noopener">Ảnh trên Maps</a>
    </div>
  </dialog>

  "uiRules": {

    "navigate": "Google Maps URL using verified place query",
    "showPrice": true,
    "showSourceIcon": true,
    "sourceIcons": {
      "human": "user-round",
      "ai": "sparkles"
    },
    "defaultView": "timeline-and-pin-map",
    "statuses": [
      "booked",
      "approved-not-booked",
      "candidate"
    ],
    "persistSelection": "shareable link or app state",
    "imageRule": "Use licensed/verified place images; do not assume image URLs"
  }
}
  </script>
  <script>
const plan = JSON.parse(document.getElementById("plan-data").textContent);
const days = plan.days;
const places = new Map(plan.places.map(place => [place.id, place]));
const maxOptions = Math.min(5, plan.uiRules.maxOptionsPerSlot);
const options = slot => slot.options.slice(0, maxOptions);
const storageKey = "dalat-v5";
let day = 0;
let selected = {};

function readSelections(value) {
  const parsed = JSON.parse(value);
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
  return Object.fromEntries(days.flatMap(({slots}) => slots
    .filter(slot => slot.kind !== "fixed" && Array.isArray(parsed[slot.id]))
    .map(slot => [slot.id, options(slot).filter(id => parsed[slot.id].includes(id))])));
}

try { selected = readSelections(localStorage.getItem(storageKey)); } catch {}
const shared = new URLSearchParams(location.search).get("plan");
if (shared) {
  try {
    const raw = JSON.parse(atob(shared));
    if (raw.version === plan.version) selected = readSelections(JSON.stringify(raw.selected));
  } catch {}
}
const checked = (slot, id) => (selected[slot.id] ?? slot.selected).includes(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character =>
  ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[character]);
const dayLabel = date => date.slice(8, 10) + "/" + date.slice(5, 7);
const number = new Intl.NumberFormat("vi-VN");
const priceLabel = price => {
  if (!price) return "Chưa có giá";
  const min = number.format(price.min);
  return (price.min === price.max ? min : min + "–" + number.format(price.max)) + " ₫";
};
const statusLabels = {booked:"Đã đặt", "approved-not-booked":"Đã duyệt · chưa đặt", candidate:"Đề xuất"};
const slotLabels = {fixed:"Đã lên lịch", travel:"Di chuyển", optional:"Tùy chọn", required:"Cần thực hiện", "required-unresolved":"Cần xác nhận"};
const crowdLabels = {
  "high-weekend-evening":"Dễ đông tối cuối tuần",
  "medium-high-weekend":"Có thể đông cuối tuần",
  "high-sunset":"Dễ đông lúc hoàng hôn",
  "medium-uncertain":"Mức đông vừa · chưa chắc chắn"
};
const sourceIcons = {
  human:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="6" r="3"/><path d="M4 17v-1a6 6 0 0 1 12 0v1"/></svg>',
  ai:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m8 2 1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6L8 2Zm7 9 1 2.8 2.8 1L16 16l-1 2.8-1-2.8-2.8-1.2 2.8-1 1-2.8Z"/></svg>'
};
const mapsSearch = query => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
const mapsDirections = query => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(query) + "&travelmode=driving&dir_action=navigate";
const placeQuery = place => place.mapQuery.toLocaleLowerCase("vi").includes(place.name.toLocaleLowerCase("vi"))
  ? place.mapQuery : place.name + ", " + place.mapQuery;
const placeSheet = document.getElementById("place-sheet");
const app = document.querySelector(".app");
const desktop = matchMedia("(min-width: 760px)");
const mapFrame = document.getElementById("map");
let focusedPlaceId;
const scrollByView = {timeline:0, map:0};

function syncMapFrame(place) {
  const visible = desktop.matches || app.dataset.view === "map";
  const query = place && placeQuery(place);
  const src = visible && query ? "https://www.google.com/maps?" + new URLSearchParams({q:query, output:"embed"}) : "";
  mapFrame.hidden = !src;
  if (src && mapFrame.getAttribute("src") !== src) mapFrame.src = src;
  if (!src) mapFrame.removeAttribute("src");
  mapFrame.title = place ? "Google Maps · " + place.name : "Google Maps";
}

document.querySelectorAll("[data-view-target]").forEach(button => {
  button.onclick = () => {
    const view = button.dataset.viewTarget;
    if (app.dataset.view === view) return;
    scrollByView[app.dataset.view] = window.scrollY;
    app.dataset.view = view;
    document.querySelectorAll("[data-view-target]").forEach(tab => {
      tab.setAttribute("aria-pressed", tab === button);
    });
    renderMap(days[day].slots);
    window.scrollTo(0, scrollByView[view]);
  };
});
desktop.addEventListener("change", () => renderMap(days[day].slots));

function openPlace(id) {
  const place = places.get(id);
  document.getElementById("sheet-title").textContent = place.name;
  document.getElementById("sheet-meta").textContent =
    plan.sourceLegend[place.source].label + " · " + statusLabels[place.status ?? "candidate"];
  document.getElementById("sheet-address").textContent = place.mapQuery;
  document.getElementById("sheet-price").textContent = priceLabel(place.priceEstimate) + (place.priceEstimate ? " / người" : "");
  document.getElementById("sheet-crowd").textContent = crowdLabels[place.crowdRisk] ?
    crowdLabels[place.crowdRisk] + " (ước tính)" : "Chưa có ước tính độ đông.";
  document.getElementById("sheet-note").textContent = place.notes ?? "";
  document.getElementById("sheet-directions").href = mapsDirections(placeQuery(place));
  document.getElementById("sheet-photos").href = mapsSearch(placeQuery(place));
  placeSheet.showModal();
}

function renderChoice(slot, id) {
  const place = places.get(id);
  const inputId = "place-" + slot.id + "-" + id;
  const name = escapeHtml(place.name);
  const risk = crowdLabels[place.crowdRisk];
  const status = place.status ?? "candidate";
  return `<div class="choice">
    <label class="pick"><input id="${inputId}" type="checkbox" aria-label="${name}" data-slot="${slot.id}" data-place="${id}" ${checked(slot, id) ? "checked" : ""} ${slot.kind === "fixed" ? "disabled" : ""}></label>
    <label for="${inputId}">
      <span class="name">${name}</span>
      <span class="badges">
        <span class="source ${place.source}">${sourceIcons[place.source]}${escapeHtml(plan.sourceLegend[place.source].label)}</span>
        <span class="status ${status}">${statusLabels[status]}</span>
      </span>
      <span class="meta">${priceLabel(place.priceEstimate)}${place.priceEstimate ? " / người" : ""}</span>
      ${risk ? '<span class="risk">' + risk + '</span>' : ""}
    </label>
    <div class="choice-end">
      <button type="button" class="maps" data-details="${id}" aria-label="Chi tiết ${name}">Chi tiết</button>
      <a class="maps" target="_blank" rel="noopener" href="${mapsSearch(placeQuery(place))}" aria-label="Google Maps: ${name}">Maps</a>
    </div>
  </div>`;
}

function render() {
  document.getElementById("tabs").innerHTML = days.map((item, i) =>
    `<button type="button" data-day="${i}" aria-pressed="${day === i}" class="${day === i ? "active" : ""}">
      <span>${dayLabel(item.date)}</span>${escapeHtml(item.label)}
    </button>`
  ).join("");
  document.querySelectorAll("[data-day]").forEach(button => {
    button.onclick = () => {
      day = Number(button.dataset.day);
      render();
      document.querySelector(`[data-day="${day}"]`).focus({preventScroll:true});
    };
  });
  const current = days[day];
  document.getElementById("area").textContent = current.area;
  document.getElementById("timeline").innerHTML = current.slots.map(slot =>
    `<article class="slot" data-slot-card="${slot.id}">
      <div class="slot-head"><span class="time">${escapeHtml(slot.time)}</span>
      ${slotLabels[slot.kind] ? '<span class="slot-kind">' + slotLabels[slot.kind] + '</span>' : ""}</div>
      <h2>${escapeHtml(slot.title)}</h2>
      ${options(slot).map(id => renderChoice(slot, id)).join("")}
      ${slot.note ? `<div class="note ${slot.kind === "required-unresolved" ? "alert" : ""}">${escapeHtml(slot.note)}</div>` : ""}
    </article>`
  ).join("");
  document.querySelectorAll("[data-details]").forEach(button => {
    button.onclick = () => openPlace(button.dataset.details);
  });
  document.querySelectorAll("[data-slot]").forEach(input => {
    input.onchange = () => {
      const slot = current.slots.find(item => item.id === input.dataset.slot);
      selected[slot.id] = options(slot).filter(id => id === input.dataset.place ? input.checked : checked(slot, id));
      try { localStorage.setItem(storageKey, JSON.stringify(selected)); } catch {}
      renderMap(current.slots);
    };
  });
  renderMap(current.slots);
}

function renderMap(slots) {
  const ids = [...new Set(slots.flatMap(slot => options(slot).filter(id => checked(slot, id))))];
  const picks = ids.map(id => places.get(id));
  const focused = picks.find(place => place.id === focusedPlaceId) ?? picks[0];
  focusedPlaceId = focused?.id;
  syncMapFrame(focused);
  const list = document.getElementById("map-list");
  list.innerHTML = picks.map(place =>
    `<div class="map-place">
      <button type="button" data-map-place="${place.id}" aria-pressed="${place.id === focusedPlaceId}">${escapeHtml(place.name)}</button>
      <button type="button" class="maps" data-map-details="${place.id}" aria-label="Chi tiết ${escapeHtml(place.name)}">Chi tiết</button>
    </div>`
  ).join("");
  list.querySelectorAll("[data-map-place]").forEach(button => {
    button.onclick = () => {
      focusedPlaceId = button.dataset.mapPlace;
      list.querySelectorAll("[data-map-place]").forEach(item => item.setAttribute("aria-pressed", item === button));
      const place = places.get(focusedPlaceId);
      syncMapFrame(place);
      if (picks.length > 5) document.getElementById("go").href = mapsSearch(placeQuery(place));
    };
  });
  list.querySelectorAll("[data-map-details]").forEach(button => {
    button.onclick = () => openPlace(button.dataset.mapDetails);
  });
  document.getElementById("count").textContent = picks.length + " đã chọn";
  document.getElementById("maphint").textContent = picks.length ?
    "Chọn một địa điểm trong danh sách để xem trên bản đồ." :
    "Chọn địa điểm trong lịch trình để xem trên Google Maps.";

  const queries = picks.map(placeQuery);
  let url = focused ? mapsSearch(placeQuery(focused)) : mapsSearch("Đà Lạt");
  if (queries.length === 1) url = mapsDirections(queries[0]);
  if (queries.length > 1 && queries.length <= 5) {
    const params = new URLSearchParams({
      api:"1", origin:queries[0], destination:queries.at(-1), travelmode:"driving"
    });
    if (queries.length > 2) params.set("waypoints", queries.slice(1,-1).join("|"));
    url = "https://www.google.com/maps/dir/?" + params;
  }
  const go = document.getElementById("go");
  go.href = url;
  go.textContent = queries.length > 1 && queries.length <= 5 ? "Lộ trình cả ngày" : "Mở Google Maps";
}

placeSheet.addEventListener("click", event => {
  if (event.target !== placeSheet) return;
  const rect = placeSheet.getBoundingClientRect();
  if (event.clientY < rect.top || event.clientX < rect.left || event.clientX > rect.right || event.clientY > rect.bottom) placeSheet.close();
});
document.getElementById("share").onclick = async () => {
  const url = new URL(location.pathname, location.origin);
  url.searchParams.set("plan", btoa(JSON.stringify({version:plan.version, selected})));
  try {
    await navigator.clipboard.writeText(url.href);
    alert("Đã sao chép link");
  } catch {
    prompt("Link chia sẻ", url.href);
  }
};
render();
  </script>
